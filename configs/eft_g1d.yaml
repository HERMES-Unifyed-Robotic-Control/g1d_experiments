# Explicit G1D adaptation; upstream EFT RoboCasa defaults are 20Hz/two views.
dataset:
  train: artifacts/data/g1d_subtasks_official_train_v1
  validation: artifacts/data/g1d_subtasks_official_validation_v1
  adapter: g1d_experiments.eft_dataset.G1DPredictiveWindowDataset
  source_episode_group_split: true
horizon:
  control_hz: 30
  history_sec: 0.5
  history_frames: 4
  future_sec: 1.5
  H: 45
  K: 4
views: [egocentric, left_wrist, right_wrist]
state_dim: 16
action_dim: 16
model:
  n_views: 3
  d_u: 512
# OpenPI baseline separately uses H=32 at30Hz; do not confuse these contracts.
